api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
ws_url: ${INTERNAL_LIVEKIT_WS}
redis:
  address: 127.0.0.1:${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 1
rtmp_port: 1935
whip_port: 8085
http_relay_port: 9190
health_port: 9191
prometheus_port: 9192
rtc_config:
  port_range_start: 51000
  port_range_end: 51200
  use_external_ip: false
  node_ip: ${LIVEKIT_NODE_IP}
cpu_cost:
  rtmp_cpu_cost: 1.0
  whip_cpu_cost: 1.0
  whip_bypass_transcoding_cpu_cost: 0.1
  url_cpu_cost: 1.0
  min_idle_ratio: 0.1
logging:
  level: info
