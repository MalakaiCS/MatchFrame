api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
ws_url: ${INTERNAL_LIVEKIT_WS}
insecure: true
redis:
  address: 127.0.0.1:${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 1
health_port: 9193
prometheus_port: 9194
log_level: info
# egress >= 1.8 reads default upload settings from storage.s3 (top-level s3 is ignored -> local upload)
storage:
  s3:
    access_key: ${S3_ACCESS_KEY}
    secret: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    force_path_style: true
# Admission control. Defaults admit one template egress per 4 vCPU; measured on the 4 vCPU reference box,
# one 720p30 template egress uses ~1.1-1.4 cores, so programme + clean for one session fit at 1.5 each.
# Re-measure before raising MAX_CONCURRENT_PROGRAMMES (see MEDIA_SPIKE.md / ACCEPTANCE_RESULTS.md A51).
cpu_cost:
  web_cpu_cost: 1.5
  room_composite_cpu_cost: 1.5
max_cpu_utilization: 0.9
